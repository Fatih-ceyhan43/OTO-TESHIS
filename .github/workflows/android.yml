
name: OTO TESHIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodlarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Klasorleri ve logoyu duzelt
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable-nodpi

          if [ -d "app/src/main " ]; then
            cp -a "app/src/main /." app/src/main/
          fi

          ICON=$(find app/src -type f -name app_icon.png -print -quit)
          if [ -n "$ICON" ]; then
            cp "$ICON" app/src/main/res/drawable-nodpi/app_icon.png
          fi

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/tr/com/kaldirac/ototeshis/MainActivity.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/drawable-nodpi/app_icon.png

      - name: APK olustur
        run: gradle clean assembleDebug --no-build-cache

      - name: APK icerigini kontrol et
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"

      - name: APK dosyasini sakla
        uses: actions/upload-artifact@v4
        with:
          name: VECTRA-GT-APK
          path: app/build/outputs/apk/debug/*.apk
          
