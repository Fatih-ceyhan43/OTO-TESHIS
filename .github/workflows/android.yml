name: OTO TESHIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodlarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Klasorleri kontrol et
        run: find . -name AndroidManifest.xml

      - name: APK olustur
        run: gradle clean assembleDebug --no-build-cache

      - name: APK dosyasini sakla
        uses: actions/upload-artifact@v4
        with:
          name: OTO-TESHIS-APK
          path: app/build/outputs/apk/debug/*.apk
