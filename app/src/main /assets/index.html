<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14263e"><link rel="manifest" href="manifest.webmanifest"><title>OTO TEŞHİS</title><style>
:root{font-family:system-ui,Arial;background:#eef2f7;color:#17283c}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e3e9ef;padding-bottom:15px}h1{font-size:22px;margin:0}h2{font-size:23px;line-height:1.3}.sub,.hint{color:#627184;font-size:14px}.tag{background:#e7f1ff;color:#164c91;padding:7px;border-radius:30px;font-size:12px}.panel{background:#f2f5f9;border-radius:12px;padding:14px;margin:18px 0}.panel p{margin:7px 0}.label{font-size:12px;letter-spacing:.08em;color:#617187;font-weight:700;margin-top:22px}button{border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:650;cursor:pointer}button:active{opacity:.75}.choice{width:100%;margin:6px 0}.yes{background:#d9f5e3;color:#116136}.no{background:#ffe1e1;color:#8b2323}.unknown{background:#e9edf3;color:#35455b}.tools{display:flex;gap:8px;margin-top:18px}.tools button{flex:1;font-size:13px;background:#f1f4f8}.tools button:disabled{opacity:.35}.result{border-left:4px solid #d38b20;background:#fff6e8;padding:14px;border-radius:8px;line-height:1.55}ul{padding-left:22px}li{margin-bottom:7px}.hidden{display:none}select{width:100%;padding:12px;border-radius:9px;border:1px solid #ccd5df;font-size:16px}footer{margin-top:28px;color:#748093;font-size:12px}</style></head><body><main class="app"><header><div><h1>🚘 OTO TEŞHİS</h1><div class="sub">Benzinli + LPG · Motor çalıştırma</div></div><span class="tag">Sürüm 1.0</span></header>
<section id="setup"><div class="panel"><b>Yakıt sistemi</b><p><select id="fuel"><option value="lpg">Benzin + LPG</option><option value="petrol">Sadece benzin</option></select></p><b>Şikâyet</b><p><select id="fault"><option value="noStart">Motor hiç çalışmıyor</option><option value="stall">Motor çalışıp stop ediyor</option><option value="intermittent">Bazen çalışıyor bazen çalışmıyor</option><option value="hard">Motor geç çalışıyor</option></select></p></div><button class="choice yes" onclick="start()">Teşhisi başlat →</button></section>
<section id="diagnostic" class="hidden"><div class="panel" id="summary"></div><div class="label" id="stepLabel"></div><h2 id="question"></h2><p class="hint" id="help"></p><div id="answers"><button class="choice yes" onclick="respond('yes')">✓ Evet</button><button class="choice no" onclick="respond('no')">✕ Hayır</button><button class="choice unknown" onclick="respond('unknown')">? Bilmiyorum / Test yapılmadı</button></div><div id="result" class="hidden"></div><div class="tools"><button id="back" onclick="back()">← Geri</button><button onclick="restart()">↻ Baştan başla</button><button onclick="report()">Raporu kopyala</button></div></section><footer>Bu yazılım ön değerlendirme içindir; kesin arıza teşhisi yerine geçmez. Ölçümler güvenli koşullarda yapılmalıdır.</footer></main>
<script>
const q={
lights:{q:"Kontak açıldığında gösterge ikaz lambaları yanıyor mu?",h:"Akü, yağ veya motor arıza lambası gibi göstergelere bakın.",yes:"crank",no:"mainpower",unknown:"crank"},
crank:{q:"Marş motoru krank milini döndürüyor mu?",h:"Yalnızca tık sesi değil, motorun çevrildiği sesi duyuyor musunuz?",yes:"speed",no:"noCrank",unknown:"noCrank"},
speed:{q:"Marş motoru motoru normal hızında döndürüyor mu?",h:"Akü zayıfmış gibi ağır veya kesik kesik mi dönüyor?",yes:"fuelTry",no:"dim",unknown:"dim"},
dim:{q:"Marşa basınca gösterge ışıkları ciddi biçimde zayıflıyor veya sönüyor mu?",h:"Hafif kararma normal olabilir; belirgin kararmayı değerlendirin.",yes:"jump",no:"voltage",unknown:"voltage"},
jump:{q:"Sağlam akü veya doğru takviye ile marş hızı normale dönüyor mu?",h:"Daha önce denemediyseniz 'Bilmiyorum' seçin. Güvenli takviye prosedürünü izleyin.",yes:"battery",no:"cables",unknown:"voltage"},
voltage:{q:"Marş sırasında akü kutuplarından gerilim ölçümü yapıldı mı ve 9,6 V'un altına düşüyor mu?",h:"Yaklaşık 20 °C için genel referanstır; akü ve araç özelliklerine göre değişir. Ölçmediyseniz Bilmiyorum seçin.",yes:"batteryCheck",no:"starterCheck",unknown:"slowUnknown"},
fuelTry:{q:"Araç yalnızca benzinde çalıştırılmaya çalışıldığında da çalışmıyor mu?",h:"LPG sistemi varsa normal benzinle çalıştırma davranışını değerlendirin.",yes:"spark",no:"lpgBranch",unknown:"spark"},
spark:{q:"Ateşleme kıvılcımı uygun ekipmanla kontrol edildi mi ve mevcut mu?",h:"Yüksek voltaj tehlikelidir; kabloyu elle tutarak test yapmayın.",yes:"fuelPressure",no:"ignition",unknown:"noStartUnknown"},
fuelPressure:{q:"Yakıt basıncı araç spesifikasyonuna uygun ölçüldü mü?",h:"Yakıt hattını kontrolsüz açmayın. Ölçüm yoksa Bilmiyorum seçin.",yes:"injector",no:"fuelSupply",unknown:"fuelUnknown"},
injector:{q:"Benzin enjektörlerine kumanda sinyali geliyor mu?",h:"Uygun test ekipmanı ve araç şeması gerekir.",yes:"timing",no:"ecuInjector",unknown:"fuelUnknown"},
timing:{q:"Motorun mekanik zamanlaması ve kompresyonu kontrol edildi mi ve normal mi?",h:"Kontrol yapılmadıysa Bilmiyorum seçin.",yes:"advanced",no:"mechanical",unknown:"advanced"}
};
const terminal={
mainpower:["Ana elektrik beslemesi","Akü kutupları, ana sigortalar, şase ve kontak beslemesi kontrol edilmeli."],
noCrank:["Marş kumanda devresi","Akü, marş rölesi, kontak çıkışı, marş otomatiği ve emniyet devreleri incelenmeli."],
battery:["Akü / şarj durumu şüphesi","Akü yük testi, kutup başları ve alternatör şarjı kontrol edilmeli. Takviye ile düzelme tek başına akü arızasını kanıtlamaz."],
cables:["Marş güç devresi","Kutup başları, şase, pozitif kablo gerilim düşümü ve marş motorunun çektiği akım ölçülmeli."],
batteryCheck:["Marşta aşırı gerilim düşümü","Akü yük testi ve marş motoru akım testi ile neden ayrıştırılmalı."],
starterCheck:["Marş performansı","Akü kutup gerilimi korunuyorsa kablo gerilim düşümü, marş motoru ve mekanik sürtünme incelenmeli."],
slowUnknown:["Düşük marş devri: ölçüm gerekli","Akü yük testi, marşta kutup gerilimi, kablo gerilim düşümü ve marş akımı ölçülmeden kesin ayrım yapılamaz."],
lpgBranch:["LPG ile ilişkili çalışma farkı","LPG ECU, enjektör kesme/emülatör devresi, LPG beslemesi ve yakıt geçişi incelenmeli."],
ignition:["Ateşleme yok","Krank sensörü, bobin beslemesi, ECU komutları ve ilgili sigorta/röleler ölçülmeli."],
noStartUnknown:["Marş normal, motor çalışmıyor","Kıvılcım, krank sinyali, benzin basıncı ve enjektör kumandası uygun ekipmanla doğrulanmalı."],
fuelSupply:["Yakıt besleme sorunu","Pompa, röle, sigorta, filtre, regülatör ve basınç ölçümü incelenmeli."],
fuelUnknown:["Yakıt sistemi ölçümü gerekli","Benzin basıncı ve enjektör kumandası ölçülmeli; LPG devresi benzin enjektör hattını etkileyebilir."],
ecuInjector:["Enjektör kumandası yok","ECU beslemesi, krank sinyali, enjektör tesisatı ve LPG enjektör kesme devresi kontrol edilmeli."],
mechanical:["Mekanik motor sorunu","Kompresyon, triger zamanlaması ve mekanik bütünlük uzman tarafından kontrol edilmeli."],
advanced:["İleri teşhis gerekli","Kıvılcım, yakıt basıncı ve enjektör kumandası doğrulanmışsa sensör verileri, kompresyon ve zamanlama daha ayrıntılı incelenmeli."]
};
let current="", history=[],config={};
function start(){config={fuel:document.getElementById("fuel").value,fault:document.getElementById("fault").value};history=[];current="lights";document.getElementById("setup").classList.add("hidden");document.getElementById("diagnostic").classList.remove("hidden");render()}
function render(){let node=q[current],end=!node;document.getElementById("summary").innerHTML="<b>Yakıt:</b> "+(config.fuel==="lpg"?"Benzin + LPG":"Benzin")+"<br><b>Şikâyet:</b> "+({noStart:"Motor hiç çalışmıyor",stall:"Motor çalışıp stop ediyor",intermittent:"Bazen çalışıyor bazen çalışmıyor",hard:"Motor geç çalışıyor"}[config.fault])+"<br><b>Yanıtlanan:</b> "+history.length;document.getElementById("stepLabel").textContent=end?"ÖN TEŞHİS SONUCU":"SORU "+(history.length+1);document.getElementById("question").textContent=end?terminal[current][0]:node.q;document.getElementById("help").textContent=end?"":node.h;document.getElementById("answers").classList.toggle("hidden",end);document.getElementById("result").classList.toggle("hidden",!end);if(end)document.getElementById("result").innerHTML='<div class="result">'+terminal[current][1]+'<p><b>Not:</b> Bu sonuç kesin teşhis değildir.</p></div>';document.getElementById("back").disabled=history.length===0}
function respond(a){history.push({id:current,answer:a});current=q[current][a];render()}
function back(){if(!history.length)return;current=history.pop().id;render()}
function restart(){history=[];current="";document.getElementById("diagnostic").classList.add("hidden");document.getElementById("setup").classList.remove("hidden")}
function report(){let s="OTO TEŞHİS RAPORU\nYakıt: "+config.fuel+"\nŞikâyet: "+config.fault+"\n"+history.map((x,i)=>(i+1)+". "+q[x.id].q+" — "+({yes:"Evet",no:"Hayır",unknown:"Bilmiyorum"}[x.answer])).join("\n");if(terminal[current])s+="\nSonuç: "+terminal[current].join(" — ");if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>alert("Rapor kopyalandı")).catch(()=>prompt("Raporu kopyalayın:",s))}else prompt("Raporu kopyalayın:",s)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
